spring:
  application:
    name: rest-spring

  datasource:
    url: jdbc:mysql://localhost:3306/people?createDatabaseIfNotExist=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false
    open-in-view: false

  sql:
    init:
      mode: never