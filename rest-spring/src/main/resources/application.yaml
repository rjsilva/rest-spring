spring:
  application:
    name: rest-spring

  datasource:
    url: jdbc:mysql://localhost:3306/people?createDatabaseIfNotExist=true
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

logging:
  level:
    ROOT: debug